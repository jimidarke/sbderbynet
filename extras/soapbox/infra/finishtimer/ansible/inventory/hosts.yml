# Finish Timer Ansible Inventory
# Raspberry Pi Zero devices for finish line detection

all:
  children:
    finishtimers:
      hosts:
        lane1-timer:
          ansible_host: 192.168.100.21
          finishtimer_derbyid: DT_54siv_0001
          finishtimer_lane: 1
        lane2-timer:
          ansible_host: 192.168.100.22
          finishtimer_derbyid: DT_54siv_0002
          finishtimer_lane: 2
        lane3-timer:
          ansible_host: 192.168.100.23
          finishtimer_derbyid: DT_54siv_0003
          finishtimer_lane: 3
      vars:
        ansible_user: pi
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
