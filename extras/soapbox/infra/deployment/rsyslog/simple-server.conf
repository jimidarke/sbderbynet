# DerbyNet Simplified Rsyslog Server Configuration
# Place in: /etc/rsyslog.d/10-derbynet-simple.conf
#
# This configuration receives logs from all DerbyNet devices and stores them
# in /var/log/derbynet/ directory with simple, fixed settings.

# Enable UDP syslog reception on port 514
module(load="imudp")
input(type="imudp" port="514")

# Create log directory if it doesn't exist
$CreateDirs on

# DerbyNet logs (facility local0)
# Store all DerbyNet logs in /var/log/derbynet/
local0.*    /var/log/derbynet/all.log

# Separate logs by service (based on programname)
:programname, isequal, "derbyRace"     /var/log/derbynet/derbyRace.log
:programname, isequal, "FinishTimer"   /var/log/derbynet/FinishTimer.log
:programname, isequal, "DerbyDisplay"  /var/log/derbynet/DerbyDisplay.log
:programname, isequal, "HLSTranscoder" /var/log/derbynet/HLSTranscoder.log
:programname, isequal, "derbyTime"     /var/log/derbynet/derbyTime.log
:programname, isequal, "DerbyLCD"      /var/log/derbynet/DerbyLCD.log
:programname, isequal, "derbynet-php"  /var/log/derbynet/php.log

# Set proper permissions for log files
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755

# Stop processing local0 messages after writing to our files
local0.* stop