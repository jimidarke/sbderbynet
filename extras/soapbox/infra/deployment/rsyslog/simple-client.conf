# DerbyNet Simplified Rsyslog Client Configuration  
# Place in: /etc/rsyslog.d/20-derbynet-simple.conf
#
# This configuration forwards all DerbyNet logs to the central server
# at 192.168.100.10 with simple, reliable settings.

# Forward all local0 facility logs (DerbyNet) to central server
local0.*    @@192.168.100.10:514

# Optional: Also keep local copy
local0.*    /var/log/derbynet/local.log

# Set proper permissions for local log files
$FileOwner root
$FileGroup adm  
$FileCreateMode 0640