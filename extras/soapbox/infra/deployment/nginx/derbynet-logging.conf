# DerbyNet Simplified Nginx Logging Configuration
# Add this to your nginx server block or include it

# Custom log format for DerbyNet
log_format derbynet_format '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '$request_time';

# Log to both local file and syslog
access_log /var/log/derbynet/nginx-access.log derbynet_format;
access_log syslog:server=192.168.100.10:514,facility=local0,tag=derbynet-nginx derbynet_format;

# Error logs
error_log /var/log/derbynet/derbyrace.log;
error_log syslog:server=192.168.100.10:514,facility=local0,tag=derbynet-nginx;