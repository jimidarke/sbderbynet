# DerbyNet PC Dual Display Configuration
# Version: 0.8.0
# Hardware: Beelink Mini S12 Intel 12th Gen N95, 8GB RAM, Dual HDMI
# Purpose: Configure dual HDMI outputs for kiosk display and status dashboard

# Display Configuration
PRIMARY_DISPLAY="HDMI-1"     # Main kiosk display (race info, standings, etc.)
SECONDARY_DISPLAY="HDMI-2"   # Status/logging display (system monitoring)

# Primary Display Settings (Race Kiosk)
PRIMARY_RESOLUTION="1920x1080"
PRIMARY_POSITION="0,0"
PRIMARY_URL="http://192.168.100.10/derbynet/kiosk.php?address="
PRIMARY_KIOSK_TYPE="now-racing"   # Options: now-racing, standings, ondeck, slideshow

# Secondary Display Settings (Status Dashboard)
SECONDARY_RESOLUTION="1920x1080"
SECONDARY_POSITION="1920,0"      # Position to the right of primary
SECONDARY_URL="file:///opt/derbynet/status_dashboard.html"
SECONDARY_REFRESH_INTERVAL="30"  # Seconds

# Browser Configuration
CHROMIUM_PATH="/usr/bin/chromium-browser"
BROWSER_FLAGS="--no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --kiosk --noerrdialogs --disable-translate --disable-features=TranslateUI --disable-ipc-flooding-protection"

# System Performance Settings
CPU_GOVERNOR="performance"       # Set CPU to performance mode
MEMORY_LIMIT="6GB"              # Reserve 2GB for system
DISABLE_WIFI=true               # Use wired ethernet only
DISABLE_BLUETOOTH=true          # Not needed for this application

# Network Configuration
NETWORK_INTERFACE="eth0"        # Primary wired interface
MQTT_BROKER="192.168.100.10"
DERBYNET_SERVER="192.168.100.10"

# Logging and Monitoring
LOG_LEVEL="INFO"
LOG_ROTATION_SIZE="100MB"
LOG_RETENTION_DAYS="7"
STATUS_UPDATE_INTERVAL="10"     # Seconds

# Auto-restart Configuration
RESTART_ON_CRASH=true
MAX_RESTARTS_PER_HOUR="5"
HEALTH_CHECK_INTERVAL="60"      # Seconds

# Display Power Management
DISPLAY_TIMEOUT="never"         # Keep displays always on
SCREENSAVER_ENABLED=false
DPMS_ENABLED=false             # Disable display power management

# X Server Configuration
DISPLAY_MANAGER="lightdm"
X_SERVER_FLAGS="-nolisten tcp -dpi 96"
COMPOSITOR="none"              # Disable compositor for better performance

# Security Settings
SSH_ENABLED=true               # Allow remote management
UFW_ENABLED=true              # Enable firewall
ALLOWED_SSH_IPS="192.168.100.0/24"
VNC_ENABLED=false             # Disable VNC for security