# Nginx configuration for DerbyNet Multi-Camera HLS streaming
# Version: 0.5.0
# Place this file in /etc/nginx/sites-available/derbynet-multicam
# Enable with: sudo ln -s /etc/nginx/sites-available/derbynet-multicam /etc/nginx/sites-enabled/

server {
    listen 8037;
    server_name derbynetpi localhost;
    
    # Root directory for HLS streams
    root /opt/hlsfeed;
    
    # Enable CORS for cross-origin requests
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
    
    # HLS streaming location for multiple cameras
    location ~ ^/hls/camera_([a-zA-Z0-9_]+)/(.+\.(m3u8|ts))$ {
        set $camera_id $1;
        set $file $2;
        
        # Serve HLS files from camera-specific directory
        alias /opt/hlsfeed/hls/camera_$camera_id/$file;
        
        # HLS-specific headers
        add_header Cache-Control 'max-age=1, no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
        
        # MIME types for HLS
        location ~ \.m3u8$ {
            add_header Content-Type 'application/vnd.apple.mpegurl';
        }
        
        location ~ \.ts$ {
            add_header Content-Type 'video/mp2t';
        }
        
        # Security headers
        add_header X-Frame-Options 'DENY';
        add_header X-Content-Type-Options 'nosniff';
    }
    
    # Legacy single camera support (backwards compatibility)
    location /hls/ {
        # Check if it's a multi-camera request first
        try_files $uri @legacy_camera;
        
        alias /opt/hlsfeed/hls/;
        
        # HLS-specific headers
        add_header Cache-Control 'max-age=1, no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
        
        # MIME types
        location ~ \.m3u8$ {
            add_header Content-Type 'application/vnd.apple.mpegurl';
        }
        
        location ~ \.ts$ {
            add_header Content-Type 'video/mp2t';
        }
    }
    
    # Legacy camera fallback (single camera setup)
    location @legacy_camera {
        # Try to serve from primary camera directory
        try_files /hls/camera_finish$uri /hls$uri =404;
    }
    
    # Camera list API endpoint
    location /api/cameras {
        default_type application/json;
        content_by_lua_block {
            local cjson = require "cjson"
            local lfs = require "lfs"
            
            local cameras = {}
            local hls_dir = "/opt/hlsfeed/hls"
            
            for dir in lfs.dir(hls_dir) do
                if dir:match("^camera_") then
                    local camera_id = dir:gsub("^camera_", "")
                    local playlist_path = hls_dir .. "/" .. dir .. "/stream.m3u8"
                    
                    -- Check if playlist exists and is recent
                    local attr = lfs.attributes(playlist_path)
                    local is_active = false
                    if attr then
                        local age = os.time() - attr.modification
                        is_active = age < 60  -- Active if updated within 60 seconds
                    end
                    
                    table.insert(cameras, {
                        id = camera_id,
                        stream_url = "/hls/camera_" .. camera_id .. "/stream.m3u8",
                        active = is_active,
                        last_update = attr and attr.modification or 0
                    })
                end
            end
            
            ngx.say(cjson.encode({
                cameras = cameras,
                timestamp = os.time()
            }))
        }
    }
    
    # Camera status endpoint
    location ~ ^/api/camera/([a-zA-Z0-9_]+)/status$ {
        set $camera_id $1;
        default_type application/json;
        
        content_by_lua_block {
            local cjson = require "cjson"
            local lfs = require "lfs"
            local camera_id = ngx.var.camera_id
            
            local playlist_path = "/opt/hlsfeed/hls/camera_" .. camera_id .. "/stream.m3u8"
            local attr = lfs.attributes(playlist_path)
            
            local status = {
                camera_id = camera_id,
                active = false,
                last_update = 0,
                segment_count = 0
            }
            
            if attr then
                local age = os.time() - attr.modification
                status.active = age < 60
                status.last_update = attr.modification
                
                -- Count segments
                local segment_count = 0
                local dir_path = "/opt/hlsfeed/hls/camera_" .. camera_id
                for file in lfs.dir(dir_path) do
                    if file:match("%.ts$") then
                        segment_count = segment_count + 1
                    end
                end
                status.segment_count = segment_count
            end
            
            ngx.say(cjson.encode(status))
        }
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
    
    # Metrics endpoint for monitoring
    location /metrics {
        default_type text/plain;
        content_by_lua_block {
            local lfs = require "lfs"
            local metrics = {}
            
            -- Count active cameras
            local active_cameras = 0
            local total_cameras = 0
            local hls_dir = "/opt/hlsfeed/hls"
            
            for dir in lfs.dir(hls_dir) do
                if dir:match("^camera_") then
                    total_cameras = total_cameras + 1
                    local playlist_path = hls_dir .. "/" .. dir .. "/stream.m3u8"
                    local attr = lfs.attributes(playlist_path)
                    if attr then
                        local age = os.time() - attr.modification
                        if age < 60 then
                            active_cameras = active_cameras + 1
                        end
                    end
                end
            end
            
            table.insert(metrics, "# HELP derbynet_cameras_total Total number of configured cameras")
            table.insert(metrics, "# TYPE derbynet_cameras_total gauge")
            table.insert(metrics, "derbynet_cameras_total " .. total_cameras)
            
            table.insert(metrics, "# HELP derbynet_cameras_active Number of active cameras")
            table.insert(metrics, "# TYPE derbynet_cameras_active gauge")
            table.insert(metrics, "derbynet_cameras_active " .. active_cameras)
            
            ngx.say(table.concat(metrics, "\n"))
        }
    }
    
    # Disable access logs for HLS segments to reduce I/O
    location ~ \.(ts|m3u8)$ {
        access_log off;
    }
    
    # Security: deny access to configuration and log files
    location ~ \.(conf|log|env)$ {
        deny all;
        return 404;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        default_type text/html;
        return 404 '<html><body><h1>Camera Stream Not Found</h1><p>The requested camera stream is not available.</p></body></html>';
    }
    
    location = /50x.html {
        default_type text/html;
        return 500 '<html><body><h1>Server Error</h1><p>An error occurred while processing your request.</p></body></html>';
    }
}