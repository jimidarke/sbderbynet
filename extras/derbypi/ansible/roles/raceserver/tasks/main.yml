---
# Raceserver role - Derby race service configuration
# Deploys and enables derbyrace and derbytime systemd services

- name: Deploy derbyrace systemd service
  ansible.builtin.template:
    src: derbyrace.service.j2
    dest: /etc/systemd/system/derbyrace.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart derbyrace

- name: Deploy derbytime systemd service
  ansible.builtin.template:
    src: derbytime.service.j2
    dest: /etc/systemd/system/derbytime.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart derbytime

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable derbyrace service
  ansible.builtin.systemd:
    name: derbyrace
    enabled: yes
    state: started

- name: Enable derbytime service
  ansible.builtin.systemd:
    name: derbytime
    enabled: yes
    state: started

# Race-day chronology CLI: a thin wrapper that exec's the Python tool
# shipped alongside derbyRace.py. Lives in /usr/local/bin so operators can
# just run `derby-chronology --heat 3/7` from any shell on the race-server.
- name: Install derby-chronology wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/derby-chronology
    mode: '0755'
    content: |
      #!/bin/sh
      exec python3 /var/lib/infra/app/derby-chronology.py "$@"
