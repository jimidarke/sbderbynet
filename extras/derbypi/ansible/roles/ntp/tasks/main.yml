---
# NTP role - Chrony NTP server configuration
# Configures the Pi as an NTP server for the derby network

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: '0644'
    backup: yes
  notify: Restart chrony

- name: Enable chrony service
  ansible.builtin.systemd:
    name: chrony
    enabled: yes
    state: started
