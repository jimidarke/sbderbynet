# DerbyNet MQTT broker config (baked into image).
# Bound to 192.168.100.10 only — race-day LAN is isolated, but defense in depth.
# allow_anonymous: race-day LAN trust model; if you change subnet topology, revisit.

listener 1883 192.168.100.10
allow_anonymous true

# Tuned per 2025 best-practice research (see docs/SD_CARD_RECOVERY.md):
# - keep retained topics surviving a power-cut close to a real race result
autosave_interval 60
autosave_on_changes false
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 65536
queue_qos0_messages false
retain_available true

# Logging via syslog so rsyslog picks it up and ships to /var/log/derbynet.log
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
