# Event-driven cloud-sync coordination files. See docs/PUBLIC_STATS.md.
#
# trigger: race code (PHP as www-data, Python as root) bumps this file's mtime
#   to request a near-immediate push. Mode 0666 so any user can update the
#   mtime even though derbynet owns it. A systemd .path unit watching this file
#   launches derbynet-cloud-sync.service. Must live OUTSIDE the service's
#   RuntimeDirectory (/run/derbynet-cloud-sync/), which systemd wipes each run.
# lock: flock target inside cloud-sync.sh so only one push runs at a time and a
#   trigger arriving mid-push coalesces into exactly one catch-up. Also stable,
#   outside the RuntimeDirectory, so contention is visible across runs.
f /run/derbynet-cloud-sync.trigger 0666 derbynet derbynet -
f /run/derbynet-cloud-sync.lock    0644 derbynet derbynet -
