# DerbyNet Rsync Daemon Configuration (baked into image)
#
# Provides read-only access to satellite-device files. Finishtimer and
# derbydisplay Pis pull /opt/derbynet/ from here on boot via derby-pull.service.

uid = nobody
gid = nogroup
use chroot = yes
max connections = 10
timeout = 300
read only = yes

[derbynet]
    path = /var/lib/infra
    comment = DerbyNet Device Files
    read only = yes
    list = yes

# Module structure exposed:
#   rsync://192.168.100.10/derbynet/finishtimer/    -> /var/lib/infra/finishtimer/
#   rsync://192.168.100.10/derbynet/derbydisplay/   -> /var/lib/infra/derbydisplay/
#   rsync://192.168.100.10/derbynet/starttimer/     -> /var/lib/infra/starttimer/
