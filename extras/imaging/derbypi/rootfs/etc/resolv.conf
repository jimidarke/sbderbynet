# Static fallback DNS for the race-day Pi.
#
# The race LAN has internet egress via the upstream gateway but no DHCP-served
# DNS (Pi is statically configured at 192.168.100.10). Without this file,
# name resolution fails — which breaks systemd-timesyncd (clock skews), the
# cloud-sync timer (scp uisp.darketech.ca → "Temporary failure"), and any
# apt/curl call out of the LAN.
#
# Cloudflare (1.1.1.1) is the primary resolver because it's fastest from
# most North American cellular paths; Google (8.8.8.8) is a backup. Both
# are stable, public, and unrestricted on port 53.
#
# If your race venue's gateway DOES serve DNS, you can prepend
# `nameserver 192.168.100.1` here; harmless even if it doesn't.
nameserver 1.1.1.1
nameserver 8.8.8.8
nameserver 1.0.0.1
options edns0 timeout:2 attempts:2
