# Forward all syslog to the central race-server Pi for unified logging.
# Single @ = UDP per docs/LOGGING.md §Race-day logging map. The imudp listener
# is configured on derbypi at /etc/rsyslog.d/10-derbynet.conf (UDP 514).
#
# UDP is best-effort and may drop messages under load; that is acceptable here
# because race-timing-critical events carry GPIO-edge timestamps inside the
# MQTT payload (TCP, retained) and are written to /var/log/derbynet.jsonl by
# the race server's own derbylogger, not via this syslog path.
*.* @192.168.100.10:514
