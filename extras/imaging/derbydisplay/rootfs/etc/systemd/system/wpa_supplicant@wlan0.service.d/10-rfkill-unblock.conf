# Unblock the WiFi rfkill soft-block immediately BEFORE wpa_supplicant starts.
# (Ported from finishtimer — same Pi OS rfkill behavior.)
#
# Pi OS soft-blocks wlan0 until the WiFi country is configured via raspi-config/
# firstrun (which we don't run). wpa_supplicant@wlan0 has
# `Requires=sys-subsystem-net-devices-wlan0.device`, so by the time it starts the
# wlan0 rfkill entry is guaranteed present and this ExecStartPre fires at exactly
# the right moment, on every (re)start. The leading '-' makes it non-fatal so a
# hiccup can't block wpa_supplicant.
[Service]
ExecStartPre=-/usr/sbin/rfkill unblock wifi
