# Static DNS resolver for ALL DerbyNet appliance roles (derbypi, finishtimer,
# derbydisplay).
#
# Pi OS Lite does NOT ship systemd-resolved, yet the base image leaves
# /etc/resolv.conf pointing at the resolved stub (nameserver 127.0.0.53).
# With nothing listening on that stub, EVERY name lookup dead-ends — which
# silently breaks systemd-timesyncd (clock never syncs / skews to build date),
# the cloud-sync timer (scp to the VPS -> "Temporary failure in name
# resolution"), and any apt/curl that egresses the LAN. systemd-networkd does
# learn DNS from DHCP, but it has nowhere to hand it without resolved.
#
# This static file is the fix. _common/customize.sh strips the stub symlink so
# this file wins. Cloudflare (1.1.1.1) primary, Google (8.8.8.8) backup,
# Cloudflare secondary (1.0.0.1) tertiary — all stable, public, port-53 open.
# Harmlessly unreachable on a fully air-gapped LAN; appliances address the
# central Pi and each other by IP, so only hostname lookups (NTP, cloud-sync)
# depend on this, and those only matter when internet egress exists.
#
# If your venue gateway serves DNS, you may prepend `nameserver <gateway>`.
nameserver 1.1.1.1
nameserver 8.8.8.8
nameserver 1.0.0.1
options edns0 timeout:2 attempts:2
