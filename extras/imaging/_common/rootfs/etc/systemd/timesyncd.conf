# Network time for ALL DerbyNet appliance roles.
#
# systemd-timesyncd IS the "quiet background NTP poller": it keeps trying in the
# background and steps the clock the moment a server is reachable, staying silent
# (no crash, no spam) when the LAN is air-gapped. We don't chase wall-clock
# accuracy on the isolated race LAN — devices receive data by IP and don't care
# about the date — but the clock should self-correct whenever internet egress
# becomes available (staging/dev LANs, or a venue with uplink).
#
# Servers are listed IP-FIRST so sync works even when DNS is unavailable (the
# default *.debian.pool.ntp.org needs DNS, which is exactly what was broken).
#   162.159.200.123 / 162.159.200.1  -> Cloudflare NTP anycast (stable, global)
#   216.239.35.0 / 216.239.35.4      -> Google time.google.com (stable anycast)
# Hostnames follow for when DNS is healthy; pool.ntp.org is the last-resort
# fallback. No fake-hwclock / RTC on satellite roles by design.
[Time]
NTP=162.159.200.123 216.239.35.0 time.cloudflare.com time.google.com
FallbackNTP=162.159.200.1 216.239.35.4 pool.ntp.org
