# Bound the network-online wait so a slow or briefly-unavailable WiFi link can't
# stall boot for the full ~120s default. The finishtimer is WiFi-only, and
# finishtimer.service retries its MQTT connection on its own, so letting boot
# proceed before the link is up is safe — and far more robust on race day than
# hanging. (This also blunts the long boot stall seen when HDMI parasitic power
# destabilises wlan0 bring-up; see docs/SD_CARD_RECOVERY.md.)
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --timeout=30
