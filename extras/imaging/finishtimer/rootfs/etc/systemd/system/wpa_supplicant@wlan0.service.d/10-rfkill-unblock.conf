# Unblock the WiFi rfkill soft-block immediately BEFORE wpa_supplicant starts.
#
# Pi OS soft-blocks wlan0 until the WiFi country is configured via
# raspi-config/firstrun (which we don't run). A standalone early-boot oneshot
# was tried first (derby-rfkill-unblock.service, v0.12.0) but it fired before
# the wlan0 rfkill device existed -> `rfkill unblock wifi` was a no-op and the
# radio stayed "Soft blocked: yes" (confirmed 2026-05-30, needed a manual
# unblock + wpa restart). wpa_supplicant@wlan0 has
# `Requires=sys-subsystem-net-devices-wlan0.device`, so by the time it starts
# the device — and its rfkill entry — is guaranteed present. Running the unblock
# as an ExecStartPre here fires at exactly the right moment, on every (re)start.
# The leading '-' makes it non-fatal so a hiccup can't block wpa_supplicant.
[Service]
ExecStartPre=-/usr/sbin/rfkill unblock wifi
