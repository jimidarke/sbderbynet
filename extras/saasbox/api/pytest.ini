[pytest]
# Test configuration for SoapboxDerbyNet API

# Test paths
testpaths = tests

# Async mode configuration
asyncio_mode = auto

# Minimum pytest version
minversion = 7.0

# Test markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark as integration test
    unit: mark as unit test

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (optional - uncomment to enable)
# addopts = --cov=app --cov=modules --cov=middleware --cov-report=term-missing
