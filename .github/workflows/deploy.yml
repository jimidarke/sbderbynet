# DerbyNet Cloud Deployment Pipeline
#
# Builds Docker images and deploys to VPS via SSH.
#   - Push to develop  → staging deployment
#   - Push to master   → production deployment
#
# Required GitHub Secrets:
#   SERVER_HOST    - VPS IP address or hostname
#   SERVER_USER    - SSH username (e.g., deploy)
#   SERVER_SSH_KEY - Private SSH key for deployment

name: Deploy

on:
  push:
    branches:
      - master
      - develop

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/sbderbynet-web
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/sbderbynet-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: installer/docker-cloud/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ steps.tags.outputs.sha_tag }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: installer/docker-cloud/Dockerfile.python
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ env.SERVER_IMAGE }}:${{ steps.tags.outputs.sha_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "dir=/opt/derbynet/production" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/derbynet/staging" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ steps.target.outputs.dir }}
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Deployed ${{ steps.target.outputs.env }} at $(date)"
