name: build-sd-images
on:
  push:
    branches: [master]
    paths:
      - 'extras/imaging/**'
      - 'extras/soapbox/infra/**'
      - 'extras/derbypi/ansible/**'
      - 'website/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write   # so the release-attach step can upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [derbypi, finishtimer, derbydisplay]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read + verify pinned base image
        id: base
        run: |
          set -euo pipefail
          URL=$(jq -r .url    extras/imaging/base-image.lock)
          SHA=$(jq -r .sha256 extras/imaging/base-image.lock)
          # Stream-verify the upstream image SHA256 without saving the file
          # (rpi-image-modifier only accepts http(s):// URLs, not file://).
          # The action will re-download with its own cache.
          echo "Verifying SHA256 of $URL"
          COMPUTED=$(curl -fL --retry 3 -sS "$URL" | sha256sum | awk '{print $1}')
          if [[ "$COMPUTED" != "$SHA" ]]; then
            echo "::error::Base image SHA mismatch. expected=$SHA computed=$COMPUTED"
            exit 1
          fi
          echo "✓ SHA256 verified: $SHA"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Sanity-check WiFi secrets
        if: matrix.role == 'finishtimer' || matrix.role == 'derbydisplay'
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          if [[ -z "$WIFI_SSID" || -z "$WIFI_PASSWORD" ]]; then
            echo "::error::WIFI_SSID and WIFI_PASSWORD repo secrets must be set for the ${{ matrix.role }} build."
            exit 1
          fi

      - name: Build ${{ matrix.role }} image
        id: build
        uses: dtcooper/rpi-image-modifier@v1
        with:
          base-image-url: ${{ steps.base.outputs.url }}
          image-path: sbderbynet-${{ matrix.role }}-${{ github.sha }}.img
          image-maxsize: 8G
          mount-repository: true
          shrink: true
          compress-with-xz: true
          cache: true
          env-vars: ROLE,GIT_SHA,WIFI_SSID,WIFI_PASSWORD
          run: |
            set -euxo pipefail
            BUILD_CTX=/mounted-github-repo
            export BUILD_CTX GIT_SHA ROLE WIFI_SSID WIFI_PASSWORD

            # 1. Stage rootfs trees (_common + role) into the image filesystem.
            #    Use -rltD --no-owner --no-group (everything from -a EXCEPT
            #    chown). The source-tree UIDs come from the GHA runner and
            #    don't map to anything inside the image; the customize
            #    scripts set ownership explicitly where it matters.
            RSYNC="rsync -rltD --no-owner --no-group"
            $RSYNC "$BUILD_CTX/extras/imaging/_common/rootfs/" /
            $RSYNC "$BUILD_CTX/extras/imaging/$ROLE/rootfs/"  /

            # 2. Apply universal hardening
            bash "$BUILD_CTX/extras/imaging/_common/customize.sh" "$ROLE"

            # 3. Apply role-specific customization
            bash "$BUILD_CTX/extras/imaging/$ROLE/customize.sh"
        env:
          ROLE: ${{ matrix.role }}
          GIT_SHA: ${{ github.sha }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}

      - name: Rename + checksum final artifact
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          IN="${{ steps.build.outputs.image-path }}"
          OUT="sbderbynet-${{ matrix.role }}-${SHORT}.img.xz"
          mv "$IN" "$OUT" || cp "$IN" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -la "$OUT"*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbderbynet-${{ matrix.role }}
          path: |
            sbderbynet-${{ matrix.role }}-*.img.xz
            sbderbynet-${{ matrix.role }}-*.img.xz.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbderbynet-${{ matrix.role }}-*.img.xz
            sbderbynet-${{ matrix.role }}-*.img.xz.sha256
