name: build-sd-images
# When does the matrix run?
#   - Push of a version tag  → only if it's a minor/major bump (vX.Y.0).
#     A 24-minute build for every routine commit was too noisy; we tag deliberately
#     when we want fresh images. Patch tags (vX.Y.Z where Z>0) are skipped via the
#     job-level `if` below — GitHub glob can't express "ends with .0" so we filter
#     in the job instead of the trigger.
#   - workflow_dispatch        → always (manual override for ad-hoc rebuilds).
#   - release created          → always (e.g. GitHub Releases UI from any tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write   # so the release-attach step can upload assets

jobs:
  build:
    # Push events: only build for minor/major bumps (tag ends in `.0`).
    # workflow_dispatch and release events: always build.
    if: github.event_name != 'push' || endsWith(github.ref, '.0')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each build is (role, arch). The armhf finishtimer variant exists
        # because the original Pi Zero W (BCM2835 / ARMv6) can't boot the
        # arm64 image. derbypi + derbydisplay are arm64-only.
        include:
          - role: derbypi
            arch: arm64
          - role: finishtimer
            arch: arm64
          - role: finishtimer
            arch: armhf
          - role: derbydisplay
            arch: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read + verify pinned base image
        id: base
        run: |
          set -euo pipefail
          URL=$(jq -r --arg arch "${{ matrix.arch }}" '.[$arch].url'    extras/imaging/base-image.lock)
          SHA=$(jq -r --arg arch "${{ matrix.arch }}" '.[$arch].sha256' extras/imaging/base-image.lock)
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "::error::No base image entry for arch=${{ matrix.arch }} in base-image.lock"
            exit 1
          fi
          # Stream-verify the upstream image SHA256 without saving the file
          # (rpi-image-modifier only accepts http(s):// URLs, not file://).
          # The action will re-download with its own cache.
          echo "Verifying SHA256 of $URL"
          COMPUTED=$(curl -fL --retry 3 -sS "$URL" | sha256sum | awk '{print $1}')
          if [[ "$COMPUTED" != "$SHA" ]]; then
            echo "::error::Base image SHA mismatch (arch=${{ matrix.arch }}). expected=$SHA computed=$COMPUTED"
            exit 1
          fi
          echo "✓ SHA256 verified: $SHA"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Sanity-check WiFi secrets
        if: matrix.role == 'finishtimer' || matrix.role == 'derbydisplay'
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          if [[ -z "$WIFI_SSID" || -z "$WIFI_PASSWORD" ]]; then
            echo "::error::WIFI_SSID and WIFI_PASSWORD repo secrets must be set for the ${{ matrix.role }}-${{ matrix.arch }} build."
            exit 1
          fi

      - name: Inject cloud-sync fleet key into derbypi rootfs
        if: matrix.role == 'derbypi'
        env:
          CLOUD_SYNC_PRIVATE_KEY: ${{ secrets.CLOUD_SYNC_PRIVATE_KEY }}
        run: |
          set -eu
          KEY_PATH=extras/imaging/derbypi/rootfs/etc/derbynet/cloud-sync-key
          mkdir -p "$(dirname "$KEY_PATH")"
          if [ -n "${CLOUD_SYNC_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CLOUD_SYNC_PRIVATE_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "✓ cloud-sync fleet key written ($(wc -c <"$KEY_PATH") bytes)"
          else
            # Leave an empty file so the rootfs tree has a known shape;
            # customize.sh detects this and warns that cloud-sync is disabled.
            : > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "::warning::CLOUD_SYNC_PRIVATE_KEY secret not set — Pi image will boot with cloud-sync disabled."
          fi

      - name: Compute artifact basename
        id: name
        run: |
          # finishtimer ships in two arch variants — include the arch in the
          # filename so operators don't confuse them. derbypi + derbydisplay
          # only have one arch each, so they keep the cleaner name.
          if [[ "${{ matrix.role }}" == "finishtimer" ]]; then
            echo "stem=sbderbynet-${{ matrix.role }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "stem=sbderbynet-${{ matrix.role }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.role }}-${{ matrix.arch }} image
        id: build
        uses: dtcooper/rpi-image-modifier@v1
        with:
          base-image-url: ${{ steps.base.outputs.url }}
          image-path: ${{ steps.name.outputs.stem }}-${{ github.sha }}.img
          image-maxsize: 8G
          mount-repository: true
          shrink: true
          compress-with-xz: true
          cache: true
          env-vars: ROLE,GIT_SHA,WIFI_SSID,WIFI_PASSWORD
          run: |
            set -euxo pipefail
            BUILD_CTX=/mounted-github-repo
            export BUILD_CTX GIT_SHA ROLE WIFI_SSID WIFI_PASSWORD

            # 1. Stage rootfs trees (_common + role) into the image filesystem.
            #    Use -rltD --no-owner --no-group (everything from -a EXCEPT
            #    chown). The source-tree UIDs come from the GHA runner and
            #    don't map to anything inside the image; the customize
            #    scripts set ownership explicitly where it matters.
            RSYNC="rsync -rltD --no-owner --no-group"
            $RSYNC "$BUILD_CTX/extras/imaging/_common/rootfs/" /
            $RSYNC "$BUILD_CTX/extras/imaging/$ROLE/rootfs/"  /

            # 2. Apply universal hardening
            bash "$BUILD_CTX/extras/imaging/_common/customize.sh" "$ROLE"

            # 3. Apply role-specific customization
            bash "$BUILD_CTX/extras/imaging/$ROLE/customize.sh"
        env:
          ROLE: ${{ matrix.role }}
          GIT_SHA: ${{ github.sha }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}

      - name: Rename + checksum final artifact
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          IN="${{ steps.build.outputs.image-path }}"
          OUT="${{ steps.name.outputs.stem }}-${SHORT}.img.xz"
          mv "$IN" "$OUT" || cp "$IN" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -la "$OUT"*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: |
            ${{ steps.name.outputs.stem }}-*.img.xz
            ${{ steps.name.outputs.stem }}-*.img.xz.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.stem }}-*.img.xz
            ${{ steps.name.outputs.stem }}-*.img.xz.sha256
