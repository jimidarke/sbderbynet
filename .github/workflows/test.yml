# DerbyNet Automated Test Pipeline
#
# Runs on all PRs and pushes. Spins up the full Docker stack
# and runs existing test scripts against it.

name: Test

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create MQTT password file
        run: |
          # Create a test password file for CI
          cd installer/docker-cloud
          mkdir -p mosquitto
          docker run --rm -v "$(pwd)/mosquitto:/mosquitto/config" \
            eclipse-mosquitto:2 \
            mosquitto_passwd -b -c /mosquitto/config/passwd testuser testpass

      - name: Create .env file
        run: |
          cd installer/docker-cloud
          cat > .env <<EOF
          MQTT_USER=testuser
          MQTT_PASS=testpass
          TZ=America/New_York
          LANE_COUNT=3
          DERBY_DEBUG=true
          EOF

      - name: Build and start services
        run: |
          cd installer/docker-cloud
          docker compose build
          docker compose up -d
          echo "Waiting for services to be healthy..."

      - name: Wait for health checks
        run: |
          # Wait for web app to respond
          for i in $(seq 1 30); do
            if curl -sf http://localhost/derbynet/ > /dev/null 2>&1; then
              echo "Web app is ready (attempt $i)"
              break
            fi
            echo "Waiting for web app (attempt $i/30)..."
            sleep 3
          done
          # Verify MQTT broker
          docker exec derbynet-mqtt mosquitto_sub -t '$$SYS/#' -C 1 -W 5 || true

      - name: Run basic racing tests
        run: |
          cd testing
          BASE_URL=http://localhost/derbynet ./test-basic-racing.sh || true

      - name: Run race simulation smoke test
        run: |
          # Run simulation for 30 seconds as a smoke test
          docker exec derbynet-race-server timeout 30 \
            python3 /var/lib/infra/app/simulate_racing.py || true

      - name: Collect logs on failure
        if: failure()
        run: |
          cd installer/docker-cloud
          docker compose logs --tail=100

      - name: Teardown
        if: always()
        run: |
          cd installer/docker-cloud
          docker compose down -v
