# Production override
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# On the VPS, images are pulled from ghcr.io (no local build).
# The `image:` key overrides local build — `docker compose pull` fetches it.
#
# Volume override: production replaces the default named volume `derbynet_data`
# with a bind mount at /opt/derbynet/production/data so that cloud-sync.sh
# (running on the Pi over scp) writes the synced DB + .cloud_readonly sentinel
# directly into the path the containers read from. This must be created on
# the VPS before bringing the stack up:
#
#     sudo mkdir -p /opt/derbynet/production/data
#     sudo chmod 777 /opt/derbynet/production/data
#     # ('nobody' uid 65534 on Alpine PHP-FPM). chmod 777 is the simplest
#     # cross-distro way to make the dir writable from inside the container.
#
# After this override is applied, the cloud-sync.sh defaults
# (CLOUD_DB_PATH=/opt/derbynet/production/data/derbynet.sqlite3) line up with
# what the PHP container reads at /var/lib/derbynet/derbynet.sqlite3 and
# /var/lib/derbynet/.cloud_readonly.

services:
  derbynet-web:
    image: ghcr.io/${GITHUB_OWNER:-sbderbynet}/sbderbynet-web:latest
    volumes:
      - /opt/derbynet/production/data:/var/lib/derbynet

  race-server:
    image: ghcr.io/${GITHUB_OWNER:-sbderbynet}/sbderbynet-server:latest
    volumes:
      - /opt/derbynet/production/data:/var/lib/derbynet

  # Spectator-pages bind: a separate host directory keeps generator output
  # outside /var/lib/derbynet, so it doesn't collide with the Pi → cloud
  # sync that writes derbynet.sqlite3 + .cloud_readonly into that path.
  # First-time bootstrap on the VPS:
  #     sudo mkdir -p /opt/derbynet/production/public-stats/tokens
  #     sudo chmod 777 /opt/derbynet/production/public-stats
  # Generator (stats container) runs as a non-root 'stats' user; chmod 777
  # is the simplest cross-distro write path. Files are world-readable by
  # design — Caddy serves them publicly under the obfuscated token URL.
  derbynet-stats-gen:
    volumes:
      - /opt/derbynet/production/data:/var/lib/derbynet:ro
      - /opt/derbynet/production/public-stats:/out

  caddy:
    volumes:
      - /opt/derbynet/production/public-stats:/srv/public-stats:ro
