# Mosquitto MQTT Broker Configuration for DerbyNet Cloud
#
# Authentication required for all connections.
# Run scripts/setup-mqtt-auth.sh to generate the password file before starting.
#
# Internal Docker containers and external gateway bridges both authenticate
# using the credentials in the passwd file.

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Default listener (MQTT)
listener 1883
protocol mqtt

# WebSocket listener for browser virtual devices (cloud-only feature).
# Caddy reverse-proxies wss://<host>/mqtt to this port; not exposed externally.
listener 9001
protocol websockets

# Require authentication for all connections
# Generate passwd file: ./scripts/setup-mqtt-auth.sh <user> <pass>
allow_anonymous false
password_file /mosquitto/config/passwd

# Per-user ACL: virtual-device user is restricted to B_* device topics.
# See README in this directory for the user provisioning steps.
acl_file /mosquitto/config/acl

# Maximum connections (unlimited)
max_connections -1

# Message size limits (unlimited)
message_size_limit 0

# Keepalive settings
max_keepalive 65535

# Auto-save interval (seconds)
autosave_interval 1800

# Queue settings for QoS 1 and 2
max_queued_messages 1000
max_queued_bytes 0
