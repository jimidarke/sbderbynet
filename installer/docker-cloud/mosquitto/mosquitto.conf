# Mosquitto MQTT Broker Configuration for DerbyNet Cloud Testing
# This configuration allows anonymous connections within the Docker network

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Default listener (MQTT)
listener 1883
protocol mqtt

# Allow anonymous connections (for internal Docker network)
# Note: This is acceptable for internal Docker networking
# For production with external access, use authentication
allow_anonymous true

# Maximum connections (unlimited)
max_connections -1

# Message size limits (unlimited)
message_size_limit 0

# Keepalive settings
max_keepalive 65535

# Auto-save interval (seconds)
autosave_interval 1800

# Queue settings for QoS 1 and 2
max_queued_messages 1000
max_queued_bytes 0
