version: '3.8'

# DerbyNet Cloud Deployment
# Caddy handles reverse proxy + automatic HTTPS (when domain configured)
# MQTT exposed on 1883 for local gateway bridge connections

services:
  # Caddy - Reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: derbynet-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - derbynet_net
    depends_on:
      derbynet-web:
        condition: service_started
    restart: unless-stopped

  # MQTT Broker - Message coordination for race events
  mqtt:
    image: eclipse-mosquitto:2
    container_name: derbynet-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - derbynet_net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PHP Web Application - Main DerbyNet server
  derbynet-web:
    build:
      context: ../..
      dockerfile: installer/docker-cloud/Dockerfile.web
    container_name: derbynet-web
    expose:
      - "80"
    environment:
      - TZ=${TZ:-America/New_York}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-16M}
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - DERBYNET_CONFIG_DIR=/var/lib/derbynet
      - DERBYNET_DATA_DIR=/var/lib/derbynet
    volumes:
      - derbynet_data:/var/lib/derbynet
    networks:
      - derbynet_net
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  # Python Race Server - Race orchestration and timer management
  race-server:
    build:
      context: ../..
      dockerfile: installer/docker-cloud/Dockerfile.python
    container_name: derbynet-race-server
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - DERBYNET_API_HOST=derbynet-web
      - DERBYNET_API_URL=http://derbynet-web/derbynet/action.php
      - DERBYNET_DB_PATH=/var/lib/derbynet
      - LANE_COUNT=${LANE_COUNT:-3}
      - DERBY_CONSOLE_LOG=true
      - DERBY_DEBUG=${DERBY_DEBUG:-false}
      - TZ=${TZ:-America/New_York}
    volumes:
      - derbynet_data:/var/lib/derbynet
      - derbynet_logs:/var/log
    networks:
      - derbynet_net
    depends_on:
      mqtt:
        condition: service_healthy
      derbynet-web:
        condition: service_started
    restart: unless-stopped

networks:
  derbynet_net:
    driver: bridge

volumes:
  derbynet_data:
    name: derbynet_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  mqtt_data:
    name: mqtt_data
  mqtt_log:
    name: mqtt_log
  derbynet_logs:
    name: derbynet_logs
