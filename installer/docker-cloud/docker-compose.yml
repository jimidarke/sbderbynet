version: '3.8'

# DerbyNet Cloud Deployment with nginx-proxy integration
# Domain: derbynet.d-t.pw

services:
  # MQTT Broker - Message coordination for race events
  mqtt:
    image: eclipse-mosquitto:2
    container_name: derbynet-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - derbynet_net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PHP Web Application - Main DerbyNet server
  derbynet-web:
    build:
      context: ../..
      dockerfile: installer/docker-cloud/Dockerfile.web
    container_name: derbynet-web
    # NO ports exposed - nginx-proxy handles external access via VIRTUAL_HOST
    expose:
      - "80"
    environment:
      - TZ=${TZ:-America/New_York}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-16M}
      - MQTT_BROKER=mqtt
      - DERBYNET_CONFIG_DIR=/var/lib/derbynet
      - DERBYNET_DATA_DIR=/var/lib/derbynet
      # nginx-proxy integration
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - derbynet_data:/var/lib/derbynet
    networks:
      - nginx-proxy    # Join existing nginx-proxy network for reverse proxy
      - derbynet_net   # Internal network for inter-container communication
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  # Python Race Server - Race orchestration and timer management
  race-server:
    build:
      context: ../..
      dockerfile: installer/docker-cloud/Dockerfile.python
    container_name: derbynet-race-server
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - DERBYNET_API_HOST=derbynet-web
      - DERBYNET_API_URL=http://derbynet-web/derbynet/action.php
      - LANE_COUNT=${LANE_COUNT:-3}
      - DERBY_CONSOLE_LOG=true
      - DERBY_DEBUG=${DERBY_DEBUG:-false}
      - TZ=${TZ:-America/New_York}
    volumes:
      - derbynet_logs:/var/log
    networks:
      - derbynet_net
    depends_on:
      mqtt:
        condition: service_healthy
      derbynet-web:
        condition: service_started
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true    # Use existing nginx-proxy network
  derbynet_net:
    driver: bridge    # Internal network for container communication

volumes:
  derbynet_data:
    name: derbynet_data
  mqtt_data:
    name: mqtt_data
  mqtt_log:
    name: mqtt_log
  derbynet_logs:
    name: derbynet_logs
