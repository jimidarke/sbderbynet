<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff7a18">
<script>
// Version-bump refresh: poll the tiny version.txt and reload only when it
// changes. While the splash gate is ON the version carries a "-splash" suffix;
// flipping the gate OFF (or any DB change) changes version.txt, so every open
// phone reloads automatically and lands back on the live page. See docs/PUBLIC_STATS.md.
(function(){var V="{{VERSION}}";setInterval(function(){
  fetch("version.txt",{cache:"no-store"}).then(function(r){return r.text();})
    .then(function(t){if(t.trim()!==V){location.reload();}}).catch(function(){});
},4000);})();
</script>
<title>Soapbox Derby</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffaf2;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-mute: #5b6473;
    --rule: #ffe0bf;
    --accent: #ff7a18;
    --accent-deep: #d8580a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 14px 12px 32px;
    max-width: 680px;
    margin-inline: auto;
    -webkit-text-size-adjust: 100%;
    line-height: 1.35;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .splash {
    background: var(--card);
    border-radius: 18px;
    border-top: 6px solid var(--accent);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px rgba(255,122,24,.14);
    padding: 40px 24px;
    text-align: center;
    margin-top: 6vh;
  }
  .splash .flag {
    font-size: 3.4rem;
    line-height: 1;
    margin-bottom: 14px;
  }
  .splash h1 {
    font-size: 1.9rem;
    margin: 0 0 10px;
    color: var(--accent-deep);
    letter-spacing: .01em;
  }
  .splash .msg {
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--ink);
    margin: 18px auto 6px;
    max-width: 26ch;
  }
  .splash .sub {
    font-size: 1rem;
    color: var(--ink-mute);
    margin: 14px auto 0;
    max-width: 30ch;
  }
  /* push the footer block to the bottom of the viewport */
  .spacer { flex: 1; }
  footer {
    margin-top: 18px;
    font-size: .8rem;
    color: var(--ink-mute);
    text-align: center;
  }
  footer .refresh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: 1px;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }
  @media (max-width: 380px) {
    body { padding: 10px 8px 24px; }
    .splash { padding: 32px 18px; }
    .splash .flag { font-size: 2.8rem; }
    .splash h1 { font-size: 1.55rem; }
    .splash .msg { font-size: 1.25rem; }
  }
  /* — Submit-feedback button (sits just above the sponsor credit) — */
  .fb-btn {
    display: block;
    max-width: 320px;
    margin: 16px auto 0;
    text-align: center;
    padding: 12px 18px;
    background: var(--card);
    color: var(--accent-deep);
    border: 2px solid var(--accent);
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    -webkit-tap-highlight-color: transparent;
  }
  .fb-btn:active { background: var(--accent); color: #fff; }
  /* — Sovereign Shelf sponsor credit (advertising; non-persistent, scroll-to-see) — */
  .sosh-credit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    max-width: 440px;
    margin: 22px auto 4px;
    padding: 14px 18px 2px;
    border-top: 1px solid rgba(19,56,75,.12);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sosh-credit img {
    flex: 0 0 auto;
    width: 34px;
    height: auto;
    opacity: .95;
  }
  .sosh-credit .sosh-txt {
    display: flex;
    flex-direction: column;
    text-align: left;
    line-height: 1.3;
    min-width: 0;
  }
  .sosh-credit .sosh-l1 {
    font-size: .82rem;
    font-weight: 600;
    color: #1f2937;
  }
  .sosh-credit .sosh-l1 b { color: #13384b; font-weight: 800; }
  .sosh-credit .sosh-l2 {
    font-size: .72rem;
    color: #5b6473;
    margin-top: 1px;
  }
</style>
</head>
<body>

  <div class="flag">🏁</div>
  <h1>Soapbox Derby</h1>
  <p class="msg">{{MESSAGE}}</p>
  <p class="sub">This page updates on its own — keep it open and it'll switch to the live schedule when racing begins.</p>
</div>
