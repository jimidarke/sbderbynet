<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff7a18">
<title>Pinny {{PINNY}} — {{ROUND}}</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffaf2;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-mute: #5b6473;
    --rule: #ffe0bf;
    --accent: #ff7a18;
    --accent-deep: #d8580a;
    --now-bg: #fff2c7;
    --now-edge: #f4a300;
    --done: #e8f7ec;
    --up: #f6f8fc;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 14px 12px 32px;
    max-width: 680px;
    margin-inline: auto;
    -webkit-text-size-adjust: 100%;
    line-height: 1.35;
  }
  header {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(255,122,24,.10);
    border-top: 4px solid var(--accent);
    margin-bottom: 12px;
  }
  .pinny {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  .pinny .label {
    font-size: .85rem;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 700;
  }
  .pinny .num {
    font-size: 2.4rem;
    font-weight: 900;
    color: var(--accent-deep);
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .meta {
    margin-top: 10px;
    font-size: .9rem;
    color: var(--ink-mute);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
  }
  .meta .round-chip {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .8rem;
  }
  .heat-now-big {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    background: var(--now-bg);
    border: 2px solid var(--now-edge);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    line-height: 1;
  }
  .heat-now-big .num {
    font-size: 1.9rem;
    color: var(--accent-deep);
    letter-spacing: .01em;
  }
  nav {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    border: 2px solid transparent;
  }
  nav a[aria-current] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-deep);
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
    font-variant-numeric: tabular-nums;
  }
  thead th {
    background: linear-gradient(180deg, #fff6ea 0%, #ffe9cf 100%);
    color: var(--accent-deep);
    text-align: left;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 10px;
    border-bottom: 2px solid var(--rule);
  }
  tbody td {
    padding: 14px 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 1.05rem;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.h { font-weight: 800; color: var(--accent-deep); font-size: 1.25rem; width: 4.5rem; }
  td.l { font-weight: 700; width: 3rem; }
  td.r { font-weight: 700; }
  td.t {
    text-align: right;
    color: var(--ink);
    white-space: nowrap;
    font-size: 1.25rem;
    font-weight: 700;
  }
  tr.up { background: var(--up); }
  tr.up td.r { color: var(--ink-mute); font-weight: 600; }
  tr.done { background: var(--done); }
  tr.done td.r { color: #2f7a3e; }
  tr.now {
    background: var(--now-bg);
    box-shadow: inset 4px 0 0 var(--now-edge);
  }
  tr.now td.r {
    color: var(--accent-deep);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .empty {
    text-align: center;
    padding: 24px 0;
    color: var(--ink-mute);
    font-style: italic;
  }
  .back {
    margin-top: 14px;
    text-align: center;
  }
  .back a {
    display: inline-block;
    padding: 10px 18px;
    background: var(--card);
    border-radius: 12px;
    text-decoration: none;
    color: var(--accent-deep);
    font-weight: 700;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    border: 2px solid var(--accent);
  }
  footer {
    margin-top: 14px;
    font-size: .8rem;
    color: var(--ink-mute);
    text-align: center;
  }
  footer .refresh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: 1px;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }
  @media (max-width: 380px) {
    body { padding: 10px 8px 24px; }
    .pinny .num { font-size: 2rem; }
    td.h { font-size: 1.1rem; }
    td.t { font-size: 1.1rem; }
    .heat-now-big { font-size: .95rem; padding: 5px 10px; }
    .heat-now-big .num { font-size: 1.55rem; }
  }
</style>
</head>
<body>
<header>
  <div class="pinny">
    <span class="label">Pinny</span>
    <span class="num">#{{PINNY}}</span>
  </div>
  <div class="meta">
    <span class="round-chip">{{ROUND}}</span>
    <span class="heat-now-big">Heat <span class="num">{{HEAT_NOW}}</span></span>
  </div>
</header>
<nav>
  <a href="../schedule.html">Schedule</a>
  <a href="../recent.html">Recent results</a>
  <a aria-current="page" href="../myraces.html">My Races</a>
</nav>
<table>
  <thead>
    <tr><th>Heat</th><th>Lane</th><th>Status</th><th>Time</th></tr>
  </thead>
  <tbody>
__STATSGEN_PAYLOAD__
  </tbody>
</table>
<p class="back"><a href="../myraces.html">← Look up another pinny</a></p>
<footer><span class="refresh-dot"></span>Updated {{UPDATED}} · refreshes every 30 s</footer>
</body>
</html>
