<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex,nofollow">
<title>Race Schedule — {{ROUND}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 1rem; max-width: 640px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 2px solid currentColor; padding-bottom: .5rem; margin-bottom: .75rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  .now-heat { font-size: .9rem; opacity: .7; }
  nav { display: flex; gap: .75rem; margin-bottom: .75rem; font-size: .9rem; }
  nav a { padding: .25rem .5rem; border: 1px solid currentColor; border-radius: 4px;
          text-decoration: none; color: inherit; }
  nav a[aria-current] { background: currentColor; color: Canvas; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: .35rem .4rem; text-align: left; border-bottom: 1px solid rgba(127,127,127,.25); }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  td.h, td.l, td.p { font-weight: 600; }
  td.p { font-size: 1.05rem; }
  td.t { text-align: right; font-variant-numeric: tabular-nums; }
  td.r { font-size: .85rem; opacity: .75; }
  tr.now { background: rgba(255, 200, 0, .25); }
  tr.now td.r { font-weight: 700; opacity: 1; }
  tr.done td.r { opacity: .9; }
  tr.up td { opacity: .6; }
  .empty { text-align: center; padding: 2rem 0; opacity: .6; }
  footer { margin-top: 1rem; font-size: .75rem; opacity: .6; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Schedule</h1>
  <div class="now-heat">{{ROUND}} · Heat {{HEAT_NOW}}</div>
</header>
<nav>
  <a aria-current="page" href="schedule.html">Schedule</a>
  <a href="recent.html">Recent results</a>
</nav>
<table>
  <thead>
    <tr><th>Heat</th><th>Lane</th><th>Pinny</th><th>Status</th><th>Time</th></tr>
  </thead>
  <tbody>
__STATSGEN_PAYLOAD__
  </tbody>
</table>
<footer>Updated {{UPDATED}} · refreshes every 30 s</footer>
</body>
</html>
