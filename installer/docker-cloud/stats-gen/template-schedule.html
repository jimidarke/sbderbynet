<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff7a18">
<title>Race Schedule — {{ROUND}}</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffaf2;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-mute: #5b6473;
    --rule: #ffe0bf;
    --accent: #ff7a18;
    --accent-deep: #d8580a;
    --now-bg: #fff2c7;
    --now-edge: #f4a300;
    --done: #e8f7ec;
    --up: #f6f8fc;
    --gold: #f5b301;
    --silver: #9aa3ad;
    --bronze: #c97d3b;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 14px 12px 32px;
    max-width: 680px;
    margin-inline: auto;
    -webkit-text-size-adjust: 100%;
    line-height: 1.35;
  }
  header {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(255,122,24,.10);
    border-top: 4px solid var(--accent);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0;
    color: var(--accent-deep);
    letter-spacing: .01em;
  }
  .meta {
    margin-top: 4px;
    font-size: .95rem;
    color: var(--ink-mute);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  .meta .round-chip {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .85rem;
  }
  .meta .heat-now {
    font-weight: 600;
    color: var(--ink);
  }
  nav {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    border: 2px solid transparent;
  }
  nav a[aria-current] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-deep);
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
    font-variant-numeric: tabular-nums;
  }
  thead th {
    background: linear-gradient(180deg, #fff6ea 0%, #ffe9cf 100%);
    color: var(--accent-deep);
    text-align: left;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 10px;
    border-bottom: 2px solid var(--rule);
  }
  tbody td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 1rem;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.h { font-weight: 700; color: var(--accent-deep); width: 4.2rem; }
  td.l { font-weight: 600; width: 3rem; }
  td.p { font-weight: 800; font-size: 1.4rem; letter-spacing: .02em; }
  td.r { font-weight: 600; }
  td.t { text-align: right; color: var(--ink-mute); white-space: nowrap; }
  tr.up { background: var(--up); }
  tr.up td { color: var(--ink-mute); }
  tr.up td.p { color: var(--ink); }
  tr.done { background: var(--done); }
  tr.done td.r {
    color: #2f7a3e;
  }
  tr.now {
    background: var(--now-bg);
    box-shadow: inset 4px 0 0 var(--now-edge);
  }
  tr.now td.r {
    color: var(--accent-deep);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  /* Place chips for finished rows */
  tr.done td.r::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--silver);
    vertical-align: -1px;
  }
  /* (refined below using attribute selectors is complex without JS; keep generic green check feel) */
  .empty {
    text-align: center;
    padding: 28px 0;
    color: var(--ink-mute);
    font-style: italic;
  }
  footer {
    margin-top: 14px;
    font-size: .8rem;
    color: var(--ink-mute);
    text-align: center;
  }
  footer .refresh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: 1px;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }
  @media (max-width: 380px) {
    body { padding: 10px 8px 24px; }
    h1 { font-size: 1.2rem; }
    td.p { font-size: 1.25rem; }
    thead th, tbody td { padding: 10px 7px; }
  }
</style>
</head>
<body>
<header>
  <h1>🏁 Race Schedule</h1>
  <div class="meta">
    <span class="round-chip">{{ROUND}}</span>
    <span class="heat-now">Current heat: {{HEAT_NOW}}</span>
  </div>
</header>
<nav>
  <a aria-current="page" href="schedule.html">Schedule</a>
  <a href="recent.html">Recent results</a>
</nav>
<table>
  <thead>
    <tr><th>Heat</th><th>Lane</th><th>Pinny</th><th>Status</th><th>Time</th></tr>
  </thead>
  <tbody>
__STATSGEN_PAYLOAD__
  </tbody>
</table>
<footer><span class="refresh-dot"></span>Updated {{UPDATED}} · auto-refreshes every 30 s</footer>
</body>
</html>
