<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff7a18">
<title>Pinny not found — {{ROUND}}</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffaf2;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-mute: #5b6473;
    --accent: #ff7a18;
    --accent-deep: #d8580a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 14px 12px 32px;
    max-width: 480px;
    margin-inline: auto;
    line-height: 1.4;
  }
  header {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(255,122,24,.10);
    border-top: 4px solid var(--accent);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0;
    color: var(--accent-deep);
  }
  .meta {
    margin-top: 4px;
    font-size: .9rem;
    color: var(--ink-mute);
  }
  .meta .round-chip {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .8rem;
  }
  .panel {
    background: var(--card);
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  }
  .panel .big {
    font-size: 3rem;
    margin: 0 0 8px;
  }
  .panel p {
    margin: 0 0 14px;
    color: var(--ink);
    font-size: 1.05rem;
  }
  .panel .hint {
    color: var(--ink-mute);
    font-size: .9rem;
    margin-bottom: 18px;
  }
  .panel a.btn {
    display: inline-block;
    padding: 12px 22px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 700;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(255,122,24,.15);
  }
</style>
</head>
<body>
<header>
  <h1>🏎️ My Races</h1>
  <div class="meta">
    <span class="round-chip">{{ROUND}}</span>
  </div>
</header>
<div class="panel">
  <div class="big">🤔</div>
  <p>That pinny isn't racing in this round.</p>
  <p class="hint">Double-check the number on the car — leading zeros count (e.g. 0042).</p>
  <a class="btn" href="../myraces.html">← Try again</a>
</div>
</body>
</html>
