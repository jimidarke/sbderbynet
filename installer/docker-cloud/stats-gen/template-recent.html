<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff7a18">
<title>Recent Results — {{ROUND}}</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffaf2;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-mute: #5b6473;
    --rule: #ffe0bf;
    --accent: #ff7a18;
    --accent-deep: #d8580a;
    --gold: #f5b301;
    --silver: #9aa3ad;
    --bronze: #c97d3b;
    --podium-shadow: rgba(245,179,1,.18);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 14px 12px 32px;
    max-width: 680px;
    margin-inline: auto;
    -webkit-text-size-adjust: 100%;
    line-height: 1.35;
  }
  header {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(255,122,24,.10);
    border-top: 4px solid var(--accent);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0;
    color: var(--accent-deep);
  }
  .meta {
    margin-top: 4px;
    font-size: .95rem;
    color: var(--ink-mute);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  .meta .round-chip {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .85rem;
  }
  .meta .heat-now { font-weight: 600; color: var(--ink); }
  nav {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    border: 2px solid transparent;
  }
  nav a[aria-current] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-deep);
  }
  section.heat {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px 4px;
    margin-bottom: 12px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  }
  section.heat:first-of-type {
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px var(--podium-shadow);
  }
  section.heat h3 {
    margin: 0 0 8px 0;
    font-size: 1.05rem;
    color: var(--accent-deep);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section.heat:first-of-type h3::before {
    content: "🏆";
    font-size: 1.1rem;
  }
  table.recent {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  table.recent th {
    text-align: left;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-mute);
    padding: 4px 6px 8px;
    border-bottom: 1px solid var(--rule);
  }
  table.recent td {
    padding: 10px 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 1rem;
  }
  table.recent tbody tr:last-child td { border-bottom: 0; }
  table.recent td.r { font-weight: 800; font-size: 1.05rem; }
  table.recent td.l { width: 3rem; font-weight: 600; }
  table.recent td.p { font-weight: 800; font-size: 1.4rem; }
  table.recent td.t { text-align: right; color: var(--ink-mute); white-space: nowrap; }
  /* Podium colors for the top row (place 1) of each heat */
  table.recent tbody tr:nth-child(1) td.r { color: var(--accent-deep); }
  table.recent tbody tr:nth-child(1) td.r::before {
    content: "🥇 ";
  }
  table.recent tbody tr:nth-child(2) td.r::before {
    content: "🥈 ";
  }
  table.recent tbody tr:nth-child(3) td.r::before {
    content: "🥉 ";
  }
  .empty {
    text-align: center;
    padding: 28px 0;
    color: var(--ink-mute);
    font-style: italic;
  }
  footer {
    margin-top: 6px;
    font-size: .8rem;
    color: var(--ink-mute);
    text-align: center;
  }
  footer .refresh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: 1px;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }
  @media (max-width: 380px) {
    body { padding: 10px 8px 24px; }
    h1 { font-size: 1.2rem; }
    table.recent td.p { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🏆 Recent Results</h1>
  <div class="meta">
    <span class="round-chip">{{ROUND}}</span>
    <span class="heat-now">Now on heat {{HEAT_NOW}}</span>
  </div>
</header>
<nav>
  <a href="schedule.html">Schedule</a>
  <a aria-current="page" href="recent.html">Recent results</a>
</nav>
__STATSGEN_PAYLOAD__
<footer><span class="refresh-dot"></span>Updated {{UPDATED}} · last 3 completed heats · refreshes every 30 s</footer>
</body>
</html>
