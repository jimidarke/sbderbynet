<title>Recent Results — {{ROUND}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 1rem; max-width: 640px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 2px solid currentColor; padding-bottom: .5rem; margin-bottom: .75rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  .now-heat { font-size: .9rem; opacity: .7; }
  nav { display: flex; gap: .75rem; margin-bottom: .75rem; font-size: .9rem; }
  nav a { padding: .25rem .5rem; border: 1px solid currentColor; border-radius: 4px;
          text-decoration: none; color: inherit; }
  nav a[aria-current] { background: currentColor; color: Canvas; }
  section.heat { margin-bottom: 1.25rem; }
  section.heat h3 { margin: 0 0 .25rem 0; font-size: 1rem; }
  table.recent { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.recent th, table.recent td {
      padding: .3rem .4rem; text-align: left;
      border-bottom: 1px solid rgba(127,127,127,.25); }
  table.recent th { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  table.recent td.r { font-weight: 700; }
  table.recent td.t { text-align: right; }
  table.recent td.p { font-size: 1.05rem; font-weight: 600; }
  tbody tr:first-child td.r { color: #c79100; }
  .empty { text-align: center; padding: 2rem 0; opacity: .6; }
  footer { margin-top: 1rem; font-size: .75rem; opacity: .6; text-align: center; }
</style>
</head>
<body>

  <h1>Recent results</h1>
  <div class="now-heat">{{ROUND}} · Heat {{HEAT_NOW}}</div>
