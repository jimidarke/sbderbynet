version: '3.8'

# DerbyNet Local Fallback Stack
#
# Full race system running locally on 192.168.100.10 when cloud is unavailable.
# Uses the same images as the cloud deployment but runs everything on the Pi.
#
# Devices reconnect automatically — same IP, same ports, no firmware changes.
#
# Usage: ./switch-to-local.sh  (or: docker compose -f docker-compose.fallback.yml up -d)

services:
  # Local MQTT Broker (no bridge, standalone)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: derbynet-mqtt-local
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-local.conf:/mosquitto/config/mosquitto.conf:ro
      - fallback_mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PHP Web Application
  derbynet-web:
    image: ghcr.io/${GITHUB_OWNER:-sbderbynet}/sbderbynet-web:latest
    container_name: derbynet-web-local
    ports:
      - "80:80"
    environment:
      - TZ=${TZ:-America/New_York}
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - DERBYNET_CONFIG_DIR=/var/lib/derbynet
      - DERBYNET_DATA_DIR=/var/lib/derbynet
    volumes:
      - fallback_data:/var/lib/derbynet
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  # Python Race Server
  race-server:
    image: ghcr.io/${GITHUB_OWNER:-sbderbynet}/sbderbynet-server:latest
    container_name: derbynet-race-server-local
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - DERBYNET_API_HOST=derbynet-web
      - DERBYNET_API_URL=http://derbynet-web/derbynet/action.php
      - DERBYNET_DB_PATH=/var/lib/derbynet
      - LANE_COUNT=${LANE_COUNT:-3}
      - DERBY_CONSOLE_LOG=true
      - TZ=${TZ:-America/New_York}
    volumes:
      - fallback_data:/var/lib/derbynet
    depends_on:
      mqtt:
        condition: service_healthy
      derbynet-web:
        condition: service_started
    restart: unless-stopped

volumes:
  fallback_data:
    name: fallback_data
  fallback_mqtt_data:
    name: fallback_mqtt_data
