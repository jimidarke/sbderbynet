# DerbyNet Local Gateway - Mosquitto MQTT Bridge Configuration
#
# This runs on the local race-day Pi (192.168.100.10) and bridges
# all derbynet/ MQTT topics bidirectionally to the cloud broker.
#
# Local devices connect here unchanged. The bridge transparently
# relays messages to/from the cloud race server.
#
# Replace CLOUD_HOST, CLOUD_MQTT_USER, and CLOUD_MQTT_PASS before use.

# =============================================================================
# Local Broker - devices connect here on the race-day network
# =============================================================================
listener 1883
protocol mqtt

# Allow anonymous access on the local network (devices don't authenticate)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

# =============================================================================
# Cloud Bridge - bidirectional relay to cloud Mosquitto
# =============================================================================
connection cloud-bridge

# Cloud MQTT broker address and port
# Replace with your VPS IP or domain
address CLOUD_HOST:1883

# Authentication for the cloud broker
remote_username CLOUD_MQTT_USER
remote_password CLOUD_MQTT_PASS

# Bridge all derbynet topics bidirectionally
# "both" = messages flow in both directions
# "1" = QoS 1 (at-least-once delivery)
topic derbynet/# both 1

# Bridge protocol settings
bridge_protocol_version mqttv311
cleansession false
try_private false

# Reconnection: start at 5s, max 30s between retries
start_type automatic
restart_timeout 5 30

# Keepalive for the bridge connection (seconds)
keepalive_interval 60

# Notify the cloud broker of bridge connection status
notifications true
notification_topic derbynet/bridge/status
