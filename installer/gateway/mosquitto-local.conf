# Mosquitto configuration for local fallback mode (no cloud bridge)
# Used by docker-compose.fallback.yml

listener 1883
protocol mqtt

# Anonymous access on local race network
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

max_connections -1
message_size_limit 0
max_keepalive 65535
autosave_interval 1800
max_queued_messages 1000
