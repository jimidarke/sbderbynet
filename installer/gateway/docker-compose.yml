version: '3.8'

# DerbyNet Local Gateway
#
# Runs on the race-day Pi (192.168.100.10) to bridge local MQTT
# to the cloud broker. All local devices connect here unchanged.
#
# Usage:
#   1. Copy .env.example to .env and set cloud credentials
#   2. docker compose up -d

services:
  mqtt-gateway:
    image: eclipse-mosquitto:2
    container_name: derbynet-gateway
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-bridge.conf:/mosquitto/config/mosquitto.conf:ro
      - gateway_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  gateway_data:
    name: gateway_data
